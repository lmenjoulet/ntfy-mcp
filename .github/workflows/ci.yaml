name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      # Hermetic end-to-end suite: builds the server, starts a fake ntfy
      # and exercises the MCP tools over HTTP. No external services.
      - run: bash scripts/run-tests.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
